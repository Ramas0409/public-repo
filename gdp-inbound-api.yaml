openapi: 3.0.3
info:
  title: Global Dispute Platform (GDP) — Inbound APIs
  version: 0.11.0-draft
  description: |
    Generic inbound contract for source dispute platforms pushing dispute data into the Global Dispute Platform (GDP).
    Serves historical backfill and live feed alike, for any source platform.
    The source platform is a path parameter; the same contract serves every migration.

    Two applications, each with its own context path:
    * **gdp-inbound-event-service** — `POST /gdp/inbound-event-service/v1/{sourceSystem}/events` — new dispute, update dispute, add note
    * **gdp-inbound-document-service** — `POST /gdp/inbound-document-service/v1/{sourceSystem}/documents` — document attach (metadata + file)

    Delivery guarantee is the source platform's: retry on 429/5xx with the **same** `correlationId`.
    GDP is idempotent on `correlationId` — a retry of an already-accepted item returns 200 again, nothing is staged twice.
    Responses: 200 accepted · 400 permanent (fix the record) · 401 credential/scope · 500 transient (retry).
    The request `correlationId` is echoed in the `v-correlation-id` response header.

    Every event carries the full case snapshot and the case/action state **as of that activity**,
    so historical replay and live feed use the same payload.

servers:
  - url: https://dev-gcpmdvs.nonprod.nb01.local
    description: Dev

security:
  - oauth2ClientCredentials: [gdp.inbound.events:write, gdp.inbound.documents:write]

tags:
  - name: Events
  - name: Documents

paths:
  /gdp/inbound-event-service/v1/{sourceSystem}/events:
    parameters:
      - $ref: '#/components/parameters/SourceSystem'
    post:
      tags: [Events]
      summary: Push a dispute lifecycle event
      operationId: pushEvent
      security:
        - oauth2ClientCredentials: [gdp.inbound.events:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeEvent'
      responses:
        '200':
          description: Accepted and staged (or already accepted — idempotent). No body.
          headers:
            v-correlation-id:
              $ref: '#/components/headers/VCorrelationId'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /gdp/inbound-document-service/v1/{sourceSystem}/documents:
    parameters:
      - $ref: '#/components/parameters/SourceSystem'
    post:
      tags: [Documents]
      summary: Push a document with its metadata
      operationId: pushDocument
      security:
        - oauth2ClientCredentials: [gdp.inbound.documents:write]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [correlationId, cardNetwork, networkCaseNumber, documentSource, file]
              properties:
                correlationId:
                  type: string
                  format: uuid
                  description: Generated by the source platform. Same on retry — idempotency key.
                cardNetwork:
                  type: string
                  enum: [VISA, MASTERCARD, MAESTRO, AMEX, DISCOVER, DINERS, JCN, JCB, CHINA_UNION_PAY, CARTE_BANCAIRE]
                networkCaseNumber:
                  type: string
                  description: Linkage key with cardNetwork — resolves the GDP case.
                documentSource:
                  type: string
                  enum: [MERCHANT, ISSUER]
                  description: Who the document came from. GDP derives its internal document type.
                file:
                  type: string
                  format: binary
                  description: Document bytes, any format. File name taken from the multipart part. GDP converts to PDF.
                sourceSystemCaseId:
                  type: string
                  description: Optional. Source platform's case ID, for reconciliation.
            encoding:
              file:
                contentType: application/octet-stream, application/pdf, image/*
      responses:
        '200':
          description: Bytes landed and staged (or already accepted — idempotent). No body.
          headers:
            v-correlation-id:
              $ref: '#/components/headers/VCorrelationId'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  headers:
    VCorrelationId:
      description: Echo of the request correlationId (platform correlation header)
      schema:
        type: string
        format: uuid

  parameters:
    SourceSystem:
      name: sourceSystem
      in: path
      required: true
      schema:
        type: string
        enum: [VAP]
      description: Source dispute platform. Stamped onto the staged event by GDP. Further platforms added as their migrations start.

  securitySchemes:
    oauth2ClientCredentials:
      type: oauth2
      description: |
        OAuth 2.0 client-credentials grant against the enterprise IDP.
        The source platform holds a system client; the issued JWT is sent as `Authorization: Bearer <token>`.
        The client's registered source system must match the `{sourceSystem}` path parameter —
        a VAP client cannot post as LATAM. mTLS at the edge additionally expected.
      flows:
        clientCredentials:
          tokenUrl: https://idp.example.internal/oauth2/token
          scopes:
            gdp.inbound.events:write: Push dispute events
            gdp.inbound.documents:write: Push documents

  responses:
    ValidationError:
      description: Permanent — invalid record or oversize file; fix the record, do not retry unchanged
      headers:
        v-correlation-id:
          $ref: '#/components/headers/VCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    Unauthorized:
      description: Missing, expired or invalid token; wrong scope; or token's source system does not match the path
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    ServerError:
      description: Transient (including throttling) — retry with the same correlationId using exponential backoff
      headers:
        v-correlation-id:
          $ref: '#/components/headers/VCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'

  schemas:

    # ───────────────────────── Event ─────────────────────────
    DisputeEvent:
      type: object
      required:
        - eventType
        - eventSequence
        - eventTimestamp
        - correlationId
        - createdBy
        - sourceSystemCaseId
        - disputeAmount
        - disputeCurrency
        - disputeCurrencyExponent
        - reasonCode
        - disputeStage
        - cpdDate
        - networkDocInd
        - reversal
        - creditDebitIndicator
        - schemeRef
        - merchantDetail
        - originalTransIdentifier
      properties:
        eventType:
          type: string
          enum: [NEW_DISPUTE, UPDATE_DISPUTE, ADD_NOTE]
        eventSequence:
          type: integer
          format: int64
          minimum: 1
          description: Per-dispute monotonic sequence assigned by the source platform. Ordering guarantee for replay and live feed.
        eventTimestamp:
          type: string
          format: date-time
          description: ISO 8601 with milliseconds.
        correlationId:
          type: string
          format: uuid
          description: Generated by the source platform. Same value on every retry — GDP idempotency key.
        createdBy:
          type: string
          maxLength: 10
        sourceSystemCaseId:
          type: string
          description: Source platform's case ID. Secondary linkage — primary is schemeRef.networkCaseNumber + cardNetwork.
        disputeAmount:
          type: number
          description: Decimal 16.4
        disputeCurrency:
          type: string
          minLength: 3
          maxLength: 3
        disputeCurrencyExponent:
          type: integer
          minimum: 0
          maximum: 9
        reasonCode:
          type: string
          maxLength: 10
        disputeStage:
          type: string
          enum: [REQ, CH1, CH2, RE2, PAB, ARB, APC, ACF]
          description: GDP stage code, mapped by the source platform.
        cpdDate:
          type: string
          format: date
        documentIndicator:
          $ref: '#/components/schemas/YN'
        networkDocInd:
          $ref: '#/components/schemas/YN'
        reversal:
          $ref: '#/components/schemas/YN'
        creditDebitIndicator:
          type: string
          enum: ['+', '-']
        partialIndicator:
          $ref: '#/components/schemas/YN'
        destICA:
          type: string
        sendICA:
          type: string
        caseType:
          type: string
          maxLength: 10
          description: Special processing classification (BJS, CAPONE, AMZN…), where applicable.
        networkRuling:
          type: string
          enum: [MERCHANT_FAVOR, ISSUER_FAVOR, SPLIT_RULING]
          description: Required only on network ruling events.
        rejectDate:
          type: string
          format: date
        rejectReason:
          type: string
          description: Multiple codes space-separated.
        schemeRef:
          $ref: '#/components/schemas/SchemeRef'
        merchantDetail:
          $ref: '#/components/schemas/MerchantDetail'
        originalTransIdentifier:
          $ref: '#/components/schemas/OriginalTransIdentifier'
        originalTransDetail:
          $ref: '#/components/schemas/OriginalTransDetail'
        actionDetail:
          allOf:
            - $ref: '#/components/schemas/ActionDetail'
          description: Case and action state as of this activity. Required on every historical event and on every live UPDATE_DISPUTE.

    SchemeRef:
      type: object
      required: [cardNetwork, networkCaseNumber]
      properties:
        cardNetwork:
          type: string
          enum: [VISA, MASTERCARD, MAESTRO, AMEX, DISCOVER, DINERS, JCN, JCB, CHINA_UNION_PAY, CARTE_BANCAIRE]
        networkCaseNumber:
          type: string
          description: Network-assigned case reference. Primary linkage key together with cardNetwork.
        networkChargebackId:
          type: string
          description: Required for Mastercard / Maestro.
        networkPhaseId:
          type: string
          description: Required for Visa / Mastercard.
        specHandling:
          type: string
          enum: [RDR, RDRDEF]
        notes:
          type: array
          items:
            $ref: '#/components/schemas/Note'

    Note:
      type: object
      required: [text]
      properties:
        type:
          type: string
          enum: [XDISCA, XDISCE, XDISCM, FRNTWK, SNOTE, ANOTE, MNOTE, MEMMSG]
        text:
          type: string

    MerchantDetail:
      type: object
      required: [mid, orgId, name, mcc, hybridMerchant]
      properties:
        mid:
          type: string
        superchain:
          type: string
        orgId:
          type: string
          description: Source platform's organisation / hierarchy ID. Key for GDP per-merchant routing state.
        name:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        mcc:
          type: string
        hybridMerchant:
          type: boolean

    OriginalTransIdentifier:
      type: object
      required: [accountNumber, issuerBIN, accountNumberLast4, arn, date, amount, currency]
      properties:
        accountNumber:
          type: string
          description: |
            DECISION PENDING — either pre-hashed by the source platform via GDP hashing API,
            or clear PAN over mTLS tokenised at the GDP edge before any persistence.
        issuerBIN:
          type: string
        accountNumberLast4:
          type: string
          minLength: 4
          maxLength: 4
        arn:
          type: string
        date:
          type: string
          format: date
        amount:
          type: number
        currency:
          type: string
          minLength: 3
          maxLength: 3
        exponent:
          type: integer
          default: 2
        wpTransactionId:
          type: string
        merchantOrderId:
          type: string
        networkTransactionId:
          type: string
        termSequence:
          type: string
        cardType:
          type: string
        enrichmentFailure:
          type: boolean
          description: Ignored when the source platform supplies originalTransDetail — GDP performs no lookup.

    OriginalTransDetail:
      type: object
      description: Optional transaction detail. All attributes optional unless stated. No CVV field by design.
      properties:
        worldpayCheckoutId: { type: string }
        type:
          type: string
          enum: [SAL, RTN]
          description: Required if object present.
        acquirerBIN: { type: string }
        merchantRefNumber: { type: string }
        entryMode:
          type: string
          description: Required if object present.
        avsResp: { type: string }
        registerNumber: { type: string }
        token: { type: string }
        authDate: { type: string, format: date }
        authAmount: { type: number }
        authAmountCurrency: { type: string }
        authAmountExponent: { type: integer }
        convertedTransAmount: { type: number }
        convertedTransAmountCurrency: { type: string }
        convertedTransAmountExponent: { type: integer }
        fundedAmount: { type: number }
        fundedAmountCurrency: { type: string }
        fundedAmountExponent: { type: integer }
        department: { type: string }
        salesPersonId: { type: string }
        tokenId: { type: string }
        xmoto: { type: string }
        processDate: { type: string, format: date }
        fraudAction: { type: string }
        fraudFilter: { type: string }
        fraudScore: { type: string }
        authoriser: { type: string }
        processor: { type: string }
        businessJurisdiction1: { type: string }
        businessJurisdiction2: { type: string }
        cardholderAuthentication: { type: string }
        gcmsIdentifier: { type: string }
        securityProtocol: { type: string }
        ucafCollectionIndicator: { type: string }
        vbvCode: { type: string }
        octSms: { type: string }
        schemeResponseCode: { type: string }
        isoResponseCode: { type: string }
        fraudEnvironment: { type: string }
        authenticationEntity: { type: string }
        authenticationMethod: { type: string }
        cardholderPresent: { type: string }
        cardCapture: { type: string }
        cardOutput: { type: string }
        cardPresent: { type: string }
        inputCapability: { type: string }
        pinCapture: { type: string }
        terminalOutput: { type: string }
        saleMethod: { type: string }
        ticketNumber: { type: string }
        transReversalDate: { type: string, format: date }
        transReversalIndicator:
          $ref: '#/components/schemas/YN'
        authCode:
          type: string
          description: Required if object present.
        authIdnty: { type: string }
        inputMethod: { type: string }
        cardLevel: { type: string }
        customerField1: { type: string }
        transactionTimestamp: { type: string, format: date-time }
        departureDate: { type: string, format: date }
        invoiceNumber: { type: string }
        tlid: { type: string }

    ActionDetail:
      type: object
      required:
        - caseStatus
        - caseStartDate
        - actionStatus
        - disputeAction
        - wpReceivedDate
        - responseDueDate
        - expirationDate
        - createdAt
        - updatedAt
        - createdBy
        - updatedBy
      properties:
        caseStatus:
          type: string
          enum: [OPEN, CLOSED]
        caseStartDate:
          type: string
          format: date
        caseEndDate:
          type: string
          format: date
          description: Required when caseStatus = CLOSED.
        disputeType:
          type: string
          enum: [PIN, SIG]
        productName:
          type: string
          enum: [DEFENDER, SIGNIFYD]
        productType:
          type: string
        actionStatus:
          type: string
          enum: [OPEN, CLOSED, ERROR, DRAFT]
        disputeAction:
          type: string
          enum: [RREQ, RRSP, FCHG, CHGM, CRMR, SCHG, RCAL, REPR, EACP, IACP, AQCO, AQWO, IDCL, IPAB, IARB, MACP, MDCL, MFAV, IFAV, IACF, OARB, OPAB, PCMP, UPDT, WDNL, NACP, NOTE, UOPS, UMRC]
          description: GDP action code, mapped by the source platform. NOTE / UOPS / UMRC pending confirmation as GDP codes.
        wpReceivedDate:
          type: string
          format: date
        responseDueDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
        queue:
          type: string
          description: Source platform's desk/queue. Informational — GDP assigns its own.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string
        outcome:
          type: string
          enum: [MLIAB, NLIAB, ALIAB]
          description: Required when the case closes with a final action.

    # ───────────────────────── Common ─────────────────────────
    StandardErrorResponse:
      type: object
      description: GDP platform-standard error body (GlobalExceptionHandler → StandardErrorResponse). Correlation is carried in the v-correlation-id response header.
      required: [errors]
      properties:
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/StandardDisplayError'

    StandardDisplayError:
      type: object
      required: [errorMessage]
      properties:
        errorMessage:
          type: string
          description: Human-readable message
        target:
          type: string
          description: Field name (e.g. schemeRef.networkCaseNumber) or system area (e.g. STAGING, THROTTLE)

    YN:
      type: string
      enum: ['Y', 'N']
